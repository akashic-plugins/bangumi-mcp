name: plugin-v3

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          path: .cache/akashic-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .cache/akashic-agent/requirements.txt
            .cache/akashic-agent/requirements-dev.txt
      - name: Install host dependencies
        # 工具结果使用 plugins.ledger.contract.ContentPart，测试需要真实宿主。
        run: pip install -r .cache/akashic-agent/requirements.txt -r .cache/akashic-agent/requirements-dev.txt
      - name: Run tests
        env:
          AKASHIC_AGENT_ROOT: ${{ github.workspace }}/.cache/akashic-agent
        run: pytest
